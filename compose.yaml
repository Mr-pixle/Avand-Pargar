services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: avand
      POSTGRES_DB: avand
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avand -d avand"]
      interval: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://avand:${POSTGRES_PASSWORD}@db:5432/avand
      HOST: 0.0.0.0
      PORT: 8082
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8082}:8082"
volumes:
  pgdata:
